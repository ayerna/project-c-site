<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; text-align: center; }
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://via.placeholder.com'); height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { font-size: 3.5rem; width: 600px; margin: 0; }
        h2 { font-weight: normal; margin: 20px; }
        .cta { display: flex; gap: 2px; }
        input { padding: 15px; width: 400px; font-size: 1.2rem; border: none; }
        button { background: #e50914; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Unlimited movies, TV shows and more!!.</h1>
        <h2>Watch anywhere. Cancel anytime for more updates contact gladwin</h2>
        <div class="cta">
            <input type="email" placeholder="Email address">
            <button>Get Started ></button>
        </div>
    </div>
</body>
</html>
